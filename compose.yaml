services:
  bookcatalog.api:
    image: bookcatalog.api
    build:
      context: .
      dockerfile: src/BookCatalog.Api/Dockerfile
    container_name: books_catalog_api
    ports:
      - "8080:8080"
    environment:
      # asp
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
  
      # db
      ConnectionStrings__DbConnection: Host=shop.products.db;Port=${POSTGRES_INTERNAL_PORT};Database=${POSTGRES_DATABASE};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
  
      # mediatr
      MediatRLicense: ${MEDIATR_LICENSE}

  books.db:
    image: postgres
    container_name: books_postgres
    restart: unless-stopped
    volumes:
      - ./postgres-data:/var/lib/postgresql
    environment:
      POSTGRES_DB: ${POSTGRES_DATABASE}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGPORT: ${POSTGRES_INTERNAL_PORT}
      
    # temp
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 10